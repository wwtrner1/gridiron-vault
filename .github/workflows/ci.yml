# The checks a contributor runs before pushing (see CLAUDE.md), on every PR,
# so a change that doesn't typecheck or build can't be merged by accident.
name: Checks

on:
  pull_request:
  push:
    branches: [main]
  # By hand from the Actions tab, for a PR whose push GitHub never ran the checks on.
  workflow_dispatch:

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  typecheck-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck (app, API function and database schema)
        run: npx tsc -p .
      - name: Build
        run: npm run build
      - name: Griddy evals (scores the ideal replies through the app's own code; no API calls)
        run: npm run griddy:live -- --dry

  # Billing end to end on the server (tests/server/): the API function on an in-memory Postgres with every
  # migration, Stripe faked at the network, Checkout -> webhook -> plan, failed payments, refunds, trials.
  server-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Server tests
        run: npm run test:server

  # The flows a coach can't lose (tests/): screens open, save and sync, PDF and
  # wristband export, offline screens, Griddy's cards and errors.
  browser-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium
      - name: Browser tests
        run: npm run test:e2e
      - name: Keep the report when something fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
