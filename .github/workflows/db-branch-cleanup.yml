# Removes the Netlify Database branch a Deploy Preview leaves behind.
# Netlify keeps every preview's database branch after the PR closes, and once
# the project's real limit of 249 fills (the dashboard says 300), every Deploy Preview fails (support case #1159571).
# - A closed PR (merged or not) has its branch deleted right away.
# - Run by hand (Actions → Netlify DB branch cleanup → Run workflow) to sweep
#   every branch without an open PR. Dry run is on by default.
# Needs the NETLIFY_AUTH_TOKEN repository secret (a Netlify personal access token).
name: Netlify DB branch cleanup

on:
  pull_request:
    types: [closed]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "List what would be deleted, delete nothing"
        type: boolean
        default: true
      limit:
        description: "Most git branches to clean up in this run (blank = all)"
        type: string
        default: ""

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: netlify-db-cleanup
  cancel-in-progress: false

env:
  SITE_ID: 1f46d552-5d7e-44b2-bb9b-b9b243241315

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Delete the closed PR's database branch
        if: github.event_name == 'pull_request'
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          MODE: closed
          BRANCH: ${{ github.event.pull_request.head.ref }}
          DRY_RUN: "false"
        run: node scripts/netlify-db-cleanup.mjs

      - name: Sweep branches with no open PR
        if: github.event_name == 'workflow_dispatch'
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          MODE: sweep
          DRY_RUN: ${{ inputs.dry_run }}
          LIMIT: ${{ inputs.limit }}
        run: |
          KEEP="$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --limit 200 --json headRefName --jq '.[].headRefName')"
          echo "Open PR branches kept:"; echo "$KEEP"
          KEEP="$KEEP" node scripts/netlify-db-cleanup.mjs
