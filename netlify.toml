[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # The Next.js Runtime (@netlify/plugin-nextjs) is installed on this site at
  # the account level, left over from an earlier configuration. There is no
  # Next.js here; this is the runtime's documented opt-out so its build hooks
  # do not run against this Vite app. Remove it if the site ever moves to Next.js.
  NETLIFY_NEXT_PLUGIN_SKIP = "true"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# The app is a single-page React router. Every unmatched path has to reach
# index.html so /build/:id and /vault resolve on a hard refresh.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
