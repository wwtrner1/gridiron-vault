[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # The Next.js Runtime (@netlify/plugin-nextjs) is installed on this site at
  # the account level, left over from an earlier configuration. There is no
  # Next.js here; this is the runtime's documented opt-out so its build hooks
  # do not run against this Vite app. Remove it if the site ever moves to Next.js.
  NETLIFY_NEXT_PLUGIN_SKIP = "true"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Rate-limit rules 2–5 of 5 (Netlify Pro allows 5; rule 1 is on the API function
# in netlify/functions/api.ts). Each counts per visitor IP and answers 429 when
# exceeded. They must sit above the SPA fallback so they match first.
# Sign-in: 10 password tries a minute.
[[redirects]]
  from = "/.netlify/identity/token"
  to = "/.netlify/identity/token"
  status = 200
  force = true
  [redirects.rate_limit]
    window_limit = 10
    window_size = 60
    aggregate_by = ["ip", "domain"]

# New accounts: 5 a minute.
[[redirects]]
  from = "/.netlify/identity/signup"
  to = "/.netlify/identity/signup"
  status = 200
  force = true
  [redirects.rate_limit]
    window_limit = 5
    window_size = 60
    aggregate_by = ["ip", "domain"]

# Password reset emails: 5 a minute.
[[redirects]]
  from = "/.netlify/identity/recover"
  to = "/.netlify/identity/recover"
  status = 200
  force = true
  [redirects.rate_limit]
    window_limit = 5
    window_size = 60
    aggregate_by = ["ip", "domain"]

# Feedback form: 5 sends a minute.
[[redirects]]
  from = "/__forms.html"
  to = "/__forms.html"
  status = 200
  force = true
  [redirects.rate_limit]
    window_limit = 5
    window_size = 60
    aggregate_by = ["ip", "domain"]

# The app is a single-page React router. Every unmatched path has to reach
# index.html so /build/:id and /vault resolve on a hard refresh.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# The service worker must never be cached, or coaches would keep an old app.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
        Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Permissions-Policy = "camera=(), microphone=(self), geolocation=(), payment=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'; upgrade-insecure-requests"
